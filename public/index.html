<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<title>Carteira de Clientes</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone.png">
<link rel="icon" type="image/png" href="/favicon-64.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Carteira">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f1; --card:#fff; --ink:#111111; --ink-2:#4a4a46; --ink-3:#8b8b85; --line:#e3e3de; --line-2:#efefeb;
  --side:#0b0b0b; --side-ink:#c4c4bd; --accent:#f8d200; --accent-2:#ffdf2e; --accent-ink:#111111; --accent-soft:#fff8d2;
  --blue:#2563eb; --blue-soft:#e8efff; --green:#15803d; --green-soft:#e6f6ec; --red:#c62828; --red-soft:#fdecec;
  --amber:#b45309; --amber-soft:#fff3dc; --gray-soft:#eef0f3;
  --radius:12px; --shadow:0 1px 2px rgba(17,17,17,.05),0 4px 16px rgba(17,17,17,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* ---------- auth ---------- */
#auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;background:radial-gradient(900px 500px at 50% -10%,rgba(248,210,0,.16) 0,transparent 60%),#0b0b0b}
.auth-logo{width:230px;max-width:70vw;height:auto;display:block}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:28px 28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5);border-top:4px solid var(--accent)}
.auth-card h1{font-size:20px;margin:0 0 4px}
.auth-card p{margin:0 0 22px;color:var(--ink-2)}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{padding:6px 8px 22px}
.brand img{display:block;width:100%;max-width:186px;height:auto}
.brand span{display:block;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#77776f}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--side-ink);font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:#1a1a1a;color:#fff}
.nav a.ativo{background:#1d1d1d;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav a.ativo svg{color:var(--accent);opacity:1}
.nav a.cta{background:var(--accent);color:var(--accent-ink);margin-bottom:10px;justify-content:center}
.nav a.cta svg{opacity:1}
.nav a.cta:hover,.nav a.cta.ativo{background:var(--accent-2);color:var(--accent-ink);box-shadow:none}
.nav .badge{margin-left:auto;background:#d32f2f;color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.nav a.cta.ativo svg{color:var(--accent-ink)}
.side-foot{margin-top:auto;border-top:1px solid #222;padding:12px 8px 0;font-size:12.5px}
.side-foot b{color:#fff;display:block;font-weight:600}
.side-foot button{margin-top:8px;background:none;border:0;color:#8a91a0;cursor:pointer;padding:0}
.side-foot button:hover{color:#fff}
main{min-width:0;padding:28px 32px 60px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar h2{margin:0;font-size:23px;letter-spacing:-.02em;font-weight:700}
.topbar .sub{color:var(--ink-3);margin-top:2px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:15px}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.kpi{padding:16px 18px}
.kpi .rot{color:var(--ink-2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
.kpi .det{color:var(--ink-3);font-size:12.5px}
.kpi.destaque{background:var(--side);color:#fff;border-color:var(--side);position:relative;overflow:hidden}
.kpi.destaque::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(248,210,0,.22),transparent 70%)}
.kpi.destaque .rot,.kpi.destaque .det{color:#a8a8a0}
.kpi.destaque .val{color:var(--accent)}
.kpi.alerta .val{color:var(--red)}
.kpi.alerta{border-left:4px solid var(--red)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f7f7f4;border-color:#d4d4cd}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.esc{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.esc:hover{background:#2a2a2a}
.btn.perigo{color:var(--red)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.bloco{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{width:30px;height:30px;padding:0;display:inline-grid;place-items:center;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--gray-soft);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;position:relative}
.campo label{font-weight:600;font-size:12.5px;color:var(--ink-2)}
.input,select.input,textarea.input{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;background:#fff;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus{border-color:#d9b800;box-shadow:0 0 0 3px rgba(248,210,0,.3)}
.input.grande{height:48px;font-size:18px;font-weight:700}
.linha{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.erro{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:9px;margin-bottom:14px;font-weight:500}
.dica{background:var(--accent-soft);color:#5c4c00;border-radius:9px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.dica svg{width:16px;height:16px;flex:none;margin-top:1px}

.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafaf8}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clicavel{cursor:pointer}
tbody tr.clicavel:hover td{background:#fffcea}
td.dir,th.dir{text-align:right}
td.acoes-td{text-align:right;white-space:nowrap}
.vazio{padding:36px 18px;text-align:center;color:var(--ink-3)}
.vazio b{display:block;color:var(--ink-2);margin-bottom:4px}
tfoot td{font-weight:700;background:#fafaf8;border-top:1px solid var(--line)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-paga{background:var(--green-soft);color:var(--green)}
.st-vencida{background:var(--red-soft);color:var(--red)}
.st-no_prazo{background:var(--amber-soft);color:var(--amber)}
.st-a_vencer{background:var(--blue-soft);color:var(--blue)}
.st-em_aberto{background:var(--gray-soft);color:var(--ink-2)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip.ativo{background:var(--ink);color:#fff;border-color:var(--ink)}
.filtros{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.filtros .input{width:auto;height:34px}
.busca{position:relative;flex:1;min-width:180px;max-width:320px}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.busca .input{padding-left:32px;width:100%}

.lista-simples{list-style:none;margin:0;padding:0}
.lista-simples li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line-2)}
.lista-simples li:last-child{border-bottom:0}
.lista-simples a{text-decoration:none}
.lista-simples a:hover b{text-decoration:underline}
.lista-simples .sub{color:var(--ink-3);font-size:12.5px}

/* autocomplete */
.ac-lista{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,23,28,.12);z-index:30;max-height:280px;overflow:auto;padding:4px}
.ac-item{padding:9px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.ac-item:hover,.ac-item.foco{background:var(--gray-soft)}
.ac-item .sub{color:var(--ink-3);font-size:12.5px}
.ac-novo{color:var(--blue);font-weight:600}
.cliente-escolhido{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;border:1px solid #d9b800;background:var(--accent-soft);border-radius:9px;padding:0 6px 0 12px;font-weight:600}

/* modal */
.modal-fundo{position:fixed;inset:0;background:rgba(11,11,11,.55);display:grid;place-items:center;padding:16px;z-index:100;animation:fade .15s}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);animation:sobe .18s}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line-2);background:#fafaf8;border-radius:0 0 14px 14px}
@keyframes fade{from{opacity:0}}
@keyframes sobe{from{transform:translateY(8px);opacity:0}}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:500;max-width:360px;animation:sobe .2s}
.toast.erro-t{background:var(--red)}

.resumo-fatura{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-2)}
.resumo-fatura div{padding:14px 18px;border-right:1px solid var(--line-2)}
.resumo-fatura div:last-child{border-right:0}
.resumo-fatura span{display:block;color:var(--ink-3);font-size:12.5px}
.resumo-fatura b{font-size:18px}
.carregando{padding:40px;text-align:center;color:var(--ink-3)}

/* carteira (a cobrar) */
.dev{padding:16px 18px;border-bottom:1px solid var(--line-2);display:grid;gap:10px}
.dev:last-child{border-bottom:0}
.dev.atrasado{box-shadow:inset 4px 0 0 var(--red)}
.dev-topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dev-nome{font-weight:700;font-size:15.5px;text-decoration:none}
.dev-nome:hover{text-decoration:underline}
.dev-sub{color:var(--ink-3);font-size:12.5px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dev-sub a{color:var(--ink-2);font-weight:600;text-decoration:none}
.dev-valor{text-align:right}
.dev-valor b{font-size:19px;letter-spacing:-.02em;display:block}
.dev-valor .tag{margin-top:4px}
.meses{display:flex;gap:6px;flex-wrap:wrap}
.mes{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;background:#fff;text-decoration:none}
.mes b{font-weight:600}
.mes.vencida{border-color:#f3c4c4;background:var(--red-soft);color:var(--red)}
.mes.no_prazo{border-color:#f1d8a8;background:var(--amber-soft);color:var(--amber)}
.nota{background:#fafaf8;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:13px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.nota .quem{color:var(--ink-3);font-size:12px}
.nota .txt{white-space:pre-wrap;word-break:break-word}
.dev-acoes{display:flex;gap:8px;flex-wrap:wrap}
.st-prom-hoje{background:var(--amber-soft);color:var(--amber)}
.st-prom-vencida{background:var(--red-soft);color:var(--red)}
.st-prom-futura{background:var(--blue-soft);color:var(--blue)}
.st-prom-cumprida{background:var(--green-soft);color:var(--green)}
.divisao{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.divisao li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:13px}
.divisao li:last-child{border-bottom:0}
.divisao li.quita{background:var(--green-soft)}
.divisao li.parcial{background:var(--accent-soft)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:12px 18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.timeline li:last-child{border-bottom:0}

/* gráficos */
.graf{position:relative;width:100%}
.graf svg{display:block;width:100%;height:auto;overflow:visible}
.graf .grade{stroke:#ebebe6;stroke-width:1;shape-rendering:crispEdges}
.graf .eixo-txt{fill:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums}
.graf .faixa{fill:transparent;cursor:default;outline:none}
.graf .faixa:hover,.graf .faixa:focus{fill:rgba(17,17,17,.045)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
#dica-graf{position:fixed;z-index:300;pointer-events:none;background:#111;color:#fff;border-radius:9px;padding:9px 11px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:170px;max-width:260px}
#dica-graf b{display:block;margin-bottom:5px;font-size:13px}
#dica-graf .lin{display:flex;justify-content:space-between;gap:14px;align-items:center;font-variant-numeric:tabular-nums}
#dica-graf .lin span{display:inline-flex;align-items:center;gap:6px;color:#cfcfc8}
#dica-graf .lin i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tab-graf{margin-top:12px;border:1px solid var(--line-2);border-radius:10px;overflow:auto}
.tab-graf td,.tab-graf th{padding:8px 12px;font-size:12.5px}
.btn-tab{background:none;border:0;color:var(--ink-2);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.segbar{display:flex;gap:2px;height:28px;margin:4px 0 14px}
.segbar div{border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:visible;min-width:0}
.hbar{list-style:none;margin:0;padding:0}
.hbar a{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:12px;align-items:center;padding:7px 0;text-decoration:none}
.hbar a:hover .hbar-nome{text-decoration:underline}
.hbar-nome{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-nome small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.hbar-trilho{height:14px;display:block}
.hbar-barra{display:block;height:14px;border-radius:0 4px 4px 0;min-width:3px}
.hbar-val{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.instalar{display:flex;align-items:center;gap:12px;background:var(--side);color:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px}
.instalar img{width:40px;height:40px;border-radius:10px;flex:none}
.instalar div{flex:1;min-width:0;font-size:13px;color:#cfcfc8}
.instalar b{color:#fff;display:block;font-size:14px}
.instalar .icon-btn{color:#aaa}
.sep{height:16px}
.print-only{display:none}

/* ---------- responsivo ---------- */
@media (max-width:1100px){ .g-4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:1fr} }
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50;border-top:2px solid var(--accent)}
  .so-desktop{display:none!important}
  .nav a.ativo{box-shadow:inset 0 3px 0 var(--accent)}
  .nav .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;font-size:10px;padding:0 4px}
  .nav a{position:relative}

  .brand,.side-foot{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 4px;flex:1;text-align:center}
  .nav a.cta{margin:0;order:0}
  .nav a .lbl-longo{display:none}
  main{padding:18px 14px 96px}
  .g-3,.g-2{grid-template-columns:1fr}
  .topbar h2{font-size:19px}
  .linha{grid-template-columns:1fr}
  .resumo-fatura{grid-template-columns:1fr}
  .resumo-fatura div{border-right:0;border-bottom:1px solid var(--line-2)}
  .esconde-mobile{display:none}
  td,th{padding:10px}
  .dev{padding:14px}
  .hbar a{grid-template-columns:minmax(90px,120px) 1fr auto;gap:8px}
  .dev-acoes .btn{flex:1}
}
.topo-mobile{display:none;align-items:center;justify-content:space-between;background:var(--side);margin:-18px -14px 16px;padding:12px 14px;border-bottom:2px solid var(--accent)}
.topo-mobile img{height:34px;width:auto;display:block}
@media (max-width:820px){ .topo-mobile{display:flex} }
@media (min-width:600px) and (max-width:820px){ .g-3{grid-template-columns:repeat(3,minmax(0,1fr))} .g-3 .kpi .val{font-size:20px} }
@media (max-width:480px){ .g-4{grid-template-columns:1fr 1fr} .kpi .val{font-size:19px} }

@media print{
  body{background:#fff}
  .sidebar,.topbar .acoes,.nao-imprime,#toasts{display:none!important}
  #app{display:block} main{padding:0}
  .card{box-shadow:none;border:1px solid #ddd}
  .print-only{display:block}
}
</style>
</head>
<body>

<!-- ======================= LOGIN / PRIMEIRO ACESSO ======================= -->
<div id="auth" hidden>
  <img class="auth-logo" src="/logo.png" alt="Logo da oficina">
  <div class="auth-card">
    <form id="form-login">
      <h1>Carteira de clientes</h1>
      <p>Entre com seu usuário e senha.</p>
      <div class="erro" id="login-erro" hidden></div>
      <div class="campo"><label for="l-usuario">Usuário</label><input class="input" id="l-usuario" autocomplete="username" autocapitalize="none" required></div>
      <div class="campo"><label for="l-senha">Senha</label><input class="input" id="l-senha" type="password" autocomplete="current-password" required></div>
      <button class="btn pri bloco" type="submit">Entrar</button>
    </form>
    <form id="form-setup" hidden>
      <h1>Primeiro acesso</h1>
      <p>Crie o usuário administrador da carteira. Depois você cadastra o resto da equipe.</p>
      <div class="erro" id="setup-erro" hidden></div>
      <div class="campo"><label for="s-oficina">Nome da oficina</label><input class="input" id="s-oficina" required></div>
      <div class="campo"><label for="s-nome">Seu nome</label><input class="input" id="s-nome" required></div>
      <div class="campo"><label for="s-usuario">Usuário para entrar</label><input class="input" id="s-usuario" autocapitalize="none" autocomplete="username" required placeholder="ex: vinicius"></div>
      <div class="campo"><label for="s-senha">Senha (mínimo 8 caracteres)</label><input class="input" id="s-senha" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn pri bloco" type="submit">Criar e entrar</button>
    </form>
  </div>
</div>

<!-- ============================== APLICAÇÃO ============================== -->
<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <img src="/logo.png" alt="" id="logo-oficina">
      <span>Carteira de clientes</span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/lancar" data-r="lancar" class="cta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Lançar<span class="lbl-longo"> serviço</span></span></a>
      <a href="#/painel" data-r="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Painel</span></a>
      <a href="#/cobrar" data-r="cobrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg><span>A cobrar</span><b class="badge" id="badge-cobrar" hidden></b></a>
      <a href="#/cobrancas" data-r="cobrancas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Cobranças</span></a>
      <a href="#/clientes" data-r="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.8-5.6-4.5-6.6"/></svg><span>Clientes</span></a>
      <a href="#/servicos" data-r="servicos" class="so-desktop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4Z"/></svg><span>Serviços</span></a>
      <a href="#/relatorios" data-r="relatorios" class="so-desktop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></svg><span>Relatórios</span></a>
      <a href="#/config" data-r="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span>Ajustes</span></a>
    </nav>
    <div class="side-foot">
      <b id="nome-usuario"></b>
      <span id="papel-usuario" class="muted"></span><br>
      <button id="btn-sair" type="button">Sair da conta</button>
    </div>
  </aside>
  <main>
    <div class="topo-mobile"><img src="/logo.png" alt=""><div style="display:flex;gap:6px"><a href="#/relatorios" class="btn sm">Relatórios</a><a href="#/servicos" class="btn sm">Serviços</a></div></div>
    <div id="view"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>
<div id="dica-graf" hidden></div>

<script>
'use strict';
/* =============================== utilidades =============================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = (c) => fmtBRL.format((c || 0) / 100);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dataBR = (d) => d ? d.split('-').reverse().join('/') : '';
const diaMes = (d) => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}` : '';
const nomeMes = (comp) => { const [a, m] = comp.split('-'); return `${MESES[Number(m) - 1]} de ${a}`; };
const nomeMesCurto = (comp) => { const [a, m] = comp.split('-'); const n = MESES[Number(m) - 1]; return `${n[0].toUpperCase() + n.slice(1)}/${a}`; };
const pad = (n) => String(n).padStart(2, '0');
function proximoMes(comp) { let [a, m] = comp.split('-').map(Number); m++; if (m > 12) { m = 1; a++; } return `${a}-${pad(m)}`; }
function mesAnterior(comp) { let [a, m] = comp.split('-').map(Number); m--; if (m < 1) { m = 12; a--; } return `${a}-${pad(m)}`; }
function janela(comp) {
  const prox = proximoMes(comp);
  const [a, m] = prox.split('-').map(Number);
  const ult = new Date(a, m, 0).getDate();
  return { inicio: `${prox}-${pad(Math.min(S.config.dia_inicio, ult))}`, fim: `${prox}-${pad(Math.min(S.config.dia_fim, ult))}` };
}
const STATUS = {
  paga: 'Paga', vencida: 'Vencida', no_prazo: 'Vence agora', a_vencer: 'A vencer', em_aberto: 'Mês corrente',
};
const tagStatus = (s) => `<span class="tag st-${s}">${STATUS[s] || s}</span>`;
const hojeISO = () => S.hoje || new Date().toISOString().slice(0, 10);
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const linkTel = (t) => { const d = String(t || '').replace(/\D/g, ''); return d ? `tel:${d}` : ''; };
/* criado_em vem do banco em UTC (AAAA-MM-DD HH:MM:SS) */
const quando = (dt) => {
  const d = new Date(String(dt).replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  return d.toLocaleString('pt-BR', { timeZone: 'America/Cuiaba', day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', ' às');
};
const PROMESSA = { hoje: 'Prometeu pagar hoje', vencida: 'Promessa não cumprida', futura: 'Prometeu pagar', cumprida: 'Promessa cumprida' };
function tagPromessa(a) {
  if (!a || !a.situacao) return '';
  const txt = a.situacao === 'futura' ? `${PROMESSA.futura} em ${diaMes(a.promessa_data)}` : a.situacao === 'vencida' ? `${PROMESSA.vencida} (${diaMes(a.promessa_data)})` : PROMESSA[a.situacao];
  return `<span class="tag st-prom-${a.situacao}">${esc(txt)}${a.promessa_centavos ? `: ${brl(a.promessa_centavos)}` : ''}</span>`;
}

const I = {
  busca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  editar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  lixo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>',
  nota: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
  dinheiro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
  mais: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  baixar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  voltar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
};

/* ================================ estado e API ================================ */
const S = { usuario: null, config: { dia_inicio: 5, dia_fim: 10, nome_oficina: '', chave_pix: '' }, hoje: null, clientes: null };

async function api(caminho, { method = 'GET', body } = {}) {
  const opts = { method, headers: {}, credentials: 'same-origin' };
  if (body !== undefined) { opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(body); }
  let r;
  try { r = await fetch('/api' + caminho, opts); } catch { throw new Error('Sem conexão com o servidor. Verifique a internet.'); }
  let dados = {};
  try { dados = await r.json(); } catch {}
  if (r.status === 401 && !caminho.startsWith('/login')) { mostrarAuth(); throw new Error(dados.erro || 'Sessão expirada.'); }
  if (!r.ok) throw new Error(dados.erro || `Erro ${r.status}`);
  return dados;
}

function toast(msg, erro = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro-t' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), erro ? 5000 : 3000);
}

/* dinheiro: digita só números e vira R$ */
function mascaraDinheiro(input, centavosIniciais = 0) {
  input.dataset.centavos = String(centavosIniciais || 0);
  input.value = centavosIniciais ? brl(centavosIniciais) : '';
  input.setAttribute('inputmode', 'numeric');
  input.addEventListener('input', () => {
    const dig = input.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
    const c = Number(dig || 0);
    input.dataset.centavos = String(c);
    input.value = c ? brl(c) : '';
  });
}
const centavosDe = (input) => Number(input.dataset.centavos || 0);

/* ================================== modal ================================== */
function abrirModal({ titulo, corpo, rodape = '', largura }) {
  fecharModal();
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-fundo"><div class="modal" role="dialog" aria-modal="true" ${largura ? `style="max-width:${largura}px"` : ''}>
    <div class="modal-h"><h3>${esc(titulo)}</h3><button class="icon-btn" data-fechar aria-label="Fechar">${I.x}</button></div>
    <div class="modal-b">${corpo}</div>${rodape ? `<div class="modal-f">${rodape}</div>` : ''}</div></div>`;
  const fundo = $('.modal-fundo', root);
  fundo.addEventListener('mousedown', (e) => { if (e.target === fundo) fecharModal(); });
  $$('[data-fechar]', root).forEach((b) => b.addEventListener('click', fecharModal));
  setTimeout(() => { const f = $('input:not([type=hidden]),select,textarea', root); f && f.focus(); }, 30);
  return $('.modal', root);
}
function fecharModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharModal(); });

function confirmar(titulo, texto, rotuloOk = 'Confirmar', perigo = true) {
  return new Promise((res) => {
    const m = abrirModal({
      titulo, corpo: `<p style="margin:0">${texto}</p>`,
      rodape: `<button class="btn" data-n>Cancelar</button><button class="btn ${perigo ? 'esc' : 'pri'}" data-s>${esc(rotuloOk)}</button>`,
    });
    $('[data-n]', m).onclick = () => { fecharModal(); res(false); };
    $('[data-s]', m).onclick = () => { fecharModal(); res(true); };
  });
}

/* ================================ autenticação ================================ */
function mostrarAuth(setup = false) {
  $('#app').hidden = true;
  $('#auth').hidden = false;
  $('#form-login').hidden = setup;
  $('#form-setup').hidden = !setup;
  setTimeout(() => (setup ? $('#s-oficina') : $('#l-usuario')).focus(), 50);
}

$('#form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#login-erro'); err.hidden = true;
  const btn = $('button[type=submit]', e.target); btn.disabled = true;
  try {
    await api('/login', { method: 'POST', body: { usuario: $('#l-usuario').value, senha: $('#l-senha').value } });
    $('#l-senha').value = '';
    await iniciarApp();
  } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  btn.disabled = false;
});

$('#form-setup').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#setup-erro'); err.hidden = true;
  const btn = $('button[type=submit]', e.target); btn.disabled = true;
  try {
    await api('/setup', { method: 'POST', body: {
      nome_oficina: $('#s-oficina').value, nome: $('#s-nome').value, usuario: $('#s-usuario').value, senha: $('#s-senha').value,
    } });
    await iniciarApp();
    location.hash = '#/config';
    toast('Tudo pronto. Confira a chave Pix e os dias de vencimento.');
  } catch (ex) { err.textContent = ex.message; err.hidden = false; }
  btn.disabled = false;
});

$('#btn-sair').addEventListener('click', async () => {
  try { await api('/logout', { method: 'POST' }); } catch {}
  S.usuario = null; S.clientes = null;
  mostrarAuth(false);
});

async function iniciarApp() {
  const d = await api('/me');
  S.usuario = d.usuario; S.config = d.config; S.hoje = d.hoje;
  aplicarNomeOficina();
  $('#nome-usuario').textContent = S.usuario.nome;
  $('#papel-usuario').textContent = S.usuario.admin ? 'Administrador' : 'Equipe';
  $('#auth').hidden = true;
  $('#app').hidden = false;
  if (!location.hash || location.hash === '#/' ) location.hash = '#/painel';
  else render();
  atualizarBadge();
}

function aplicarNomeOficina() {
  document.title = `${S.config.nome_oficina} · Carteira de clientes`;
  $('#logo-oficina').alt = S.config.nome_oficina;
}

/* número de clientes com conta vencida, no menu */
async function atualizarBadge(qtd) {
  if (qtd === undefined) { try { qtd = (await api('/carteira')).resumo.clientes_vencidos; } catch { return; } }
  const b = $('#badge-cobrar');
  b.textContent = qtd; b.hidden = !qtd;
}

async function boot() {
  try {
    const st = await fetch('/api/setup').then((r) => r.json());
    if (st.precisaSetup) return mostrarAuth(true);
    await iniciarApp();
  } catch {
    mostrarAuth(false);
  }
}

/* =================================== rotas =================================== */
function rotaAtual() {
  const h = location.hash.replace(/^#\/?/, '');
  const [caminho, qs] = h.split('?');
  return { partes: caminho.split('/').filter(Boolean), params: new URLSearchParams(qs || '') };
}

async function render() {
  if (!S.usuario) return;
  const { partes, params } = rotaAtual();
  const r = partes[0] || 'painel';
  $$('#nav a').forEach((a) => a.classList.toggle('ativo', a.dataset.r === r || (r === 'fatura' && a.dataset.r === 'cobrancas')));
  const view = $('#view');
  S.graficos = []; esconderDica();
  view.innerHTML = '<div class="carregando">Carregando...</div>';
  window.scrollTo(0, 0);
  try {
    if (r === 'painel') await vPainel(view);
    else if (r === 'lancar') await vLancar(view, params);
    else if (r === 'servicos') await vServicos(view, params);
    else if (r === 'cobrancas') await vCobrancas(view, params);
    else if (r === 'cobrar') await vCobrar(view, params);
    else if (r === 'relatorios') await vRelatorios(view, params);
    else if (r === 'fatura') await vFatura(view, Number(partes[1]), partes[2]);
    else if (r === 'clientes' && partes[1]) await vCliente(view, Number(partes[1]));
    else if (r === 'clientes') await vClientes(view, params);
    else if (r === 'config') await vConfig(view);
    else location.hash = '#/painel';
  } catch (ex) {
    view.innerHTML = `<div class="card"><div class="vazio"><b>Não foi possível carregar</b>${esc(ex.message)}</div></div>`;
  }
}
window.addEventListener('hashchange', render);

const topo = (titulo, sub = '', acoes = '') =>
  `<div class="topbar"><div><h2>${titulo}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="acoes">${acoes}</div></div>`;

/* =================================== painel =================================== */
async function vPainel(view) {
  const [d, rel] = await Promise.all([api('/painel'), api('/relatorios?meses=6').catch(() => null)]);
  const mov = rel ? cardMovimento(rel.movimento, { compacto: true }) : null;
  S.hoje = d.hoje; S.config = d.config;
  const c = d.cobranca, v = d.vencidas, m = d.mes_atual;
  const pct = c.total ? Math.round((c.recebido / c.total) * 100) : 0;
  const hoje = d.hoje;
  let fase = '';
  if (hoje < c.inicio) fase = `Cobrança de ${nomeMes(c.competencia)} começa em ${dataBR(c.inicio)}`;
  else if (hoje <= c.fim) fase = `Período de pagamento aberto até ${dataBR(c.fim)}`;
  else fase = `Prazo de ${nomeMes(c.competencia)} encerrou em ${dataBR(c.fim)}`;

  const pr = d.promessas || [];
  view.innerHTML = faixaInstalar() + topo('Painel', `Hoje é ${dataBR(hoje)}`, `<a class="btn" href="#/cobrar">A cobrar</a><a class="btn pri" href="#/lancar">${I.mais} Lançar serviço</a>`) + `
  <div class="grid g-4">
    <div class="card kpi destaque">
      <div class="rot">A receber de ${esc(nomeMesCurto(c.competencia))}</div>
      <div class="val num">${brl(c.saldo)}</div>
      <div class="det">${esc(fase)}</div>
    </div>
    <div class="card kpi">

async function carregarClientes(forcar = false) {
  if (!S.clientes || forcar) S.clientes = (await api('/clientes')).clientes;
  return S.clientes;
}
const normal = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

/* seletor de cliente com busca e cadastro rápido */
function seletorCliente(container, { inicialId = null, aoEscolher = () => {} } = {}) {
  let escolhido = null;
  let foco = -1;
  const desenhar = () => {
    if (escolhido) {
      container.innerHTML = `<div class="cliente-escolhido"><span>${esc(escolhido.nome)}${escolhido.telefone ? ` <span class="muted small">${esc(escolhido.telefone)}</span>` : ''}</span><button type="button" class="icon-btn" aria-label="Trocar cliente">${I.x}</button></div>`;
      $('button', container).onclick = () => { escolhido = null; aoEscolher(null); desenhar(); $('input', container).focus(); };
    } else {
      container.innerHTML = `<input class="input" placeholder="Digite o nome do cliente" autocomplete="off"><div class="ac-lista" hidden></div>`;
      const inp = $('input', container), lista = $('.ac-lista', container);
      const atualizar = () => {
        const q = normal(inp.value.trim());
        const res = (S.clientes || []).filter((c) => !q || normal(c.nome).includes(q) || normal(c.telefone).includes(q)).slice(0, 8);
        foco = res.length ? 0 : -1;
        lista.innerHTML = res.map((c, i) => `<div class="ac-item${i === 0 ? ' foco' : ''}" data-id="${c.id}"><span>${esc(c.nome)}</span><span class="sub">${esc(c.telefone || '')}</span></div>`).join('')
          + (inp.value.trim() ? `<div class="ac-item ac-novo" data-novo="1">+ Cadastrar "${esc(inp.value.trim())}"</div>` : '');
        if (!res.length && inp.value.trim()) foco = 0;
        lista.hidden = !lista.innerHTML;
      };
      inp.addEventListener('input', atualizar);
      inp.addEventListener('focus', atualizar);
      inp.addEventListener('blur', () => setTimeout(() => (lista.hidden = true), 150));
      inp.addEventListener('keydown', (e) => {
        const itens = $$('.ac-item', lista);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          if (!itens.length) return;
          foco = (foco + (e.key === 'ArrowDown' ? 1 : -1) + itens.length) % itens.length;
          itens.forEach((it, i) => it.classList.toggle('foco', i === foco));
        } else if (e.key === 'Enter') {
          if (!lista.hidden && itens[foco]) { e.preventDefault(); itens[foco].dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })); }
        }
      });
      lista.addEventListener('mousedown', async (e) => {
        const it = e.target.closest('.ac-item'); if (!it) return;
        e.preventDefault();
        if (it.dataset.novo) {
          const novo = await modalCliente({ nome: inp.value.trim() });
          if (novo) { escolhido = novo; aoEscolher(novo); desenhar(); }
        } else {
          escolhido = S.clientes.find((c) => c.id === Number(it.dataset.id));
          aoEscolher(escolhido); desenhar();
        }
      });
    }
  };
  if (inicialId) escolhido = (S.clientes || []).find((c) => c.id === Number(inicialId)) || null;
  if (escolhido) aoEscolher(escolhido);
  desenhar();
  return { get: () => escolhido };
}

function modalCliente(cliente = {}) {
  return new Promise((res) => {
    const editando = !!cliente.id;
    const m = abrirModal({
      titulo: editando ? 'Editar cliente' : 'Novo cliente',
      corpo: `<form id="f-cli"><div class="erro" hidden></div>
        <div class="campo"><label>Nome do cliente ou empresa</label><input class="input" name="nome" required value="${esc(cliente.nome)}"></div>
        <div class="linha">
          <div class="campo"><label>Telefone</label><input class="input" name="telefone" inputmode="tel" placeholder="(66) 99999-9999" value="${esc(cliente.telefone)}"></div>
          <div class="campo"><label>CPF ou CNPJ</label><input class="input" name="documento" value="${esc(cliente.documento)}"></div>
        </div>
        <div class="campo"><label>Observações</label><textarea class="input" name="observacoes" rows="2">${esc(cliente.observacoes)}</textarea></div>
        ${editando ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="ativo" ${cliente.ativo ? 'checked' : ''}> Cliente ativo</label>` : ''}
        <button hidden></button></form>`,
      rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn pri" data-salvar>${editando ? 'Salvar' : 'Cadastrar cliente'}</button>`,
    });
    const f = $('#f-cli', m);
    $('[name=telefone]', f).addEventListener('input', (e) => (e.target.value = mascaraTel(e.target.value)));
    $$('[data-fechar]', m).forEach((b) => b.addEventListener('click', () => res(null)));
    const salvar = async (e) => {
      e && e.preventDefault();
      const body = Object.fromEntries(new FormData(f));
      if (editando) body.ativo = !!$('[name=ativo]', f).checked;
      try {
        const r = editando ? await api(`/clientes/${cliente.id}`, { method: 'PUT', body }) : await api('/clientes', { method: 'POST', body });
        await carregarClientes(true);
        fecharModal(); toast(editando ? 'Cliente atualizado.' : 'Cliente cadastrado.');
        res(r.cliente);
      } catch (ex) { const er = $('.erro', f); er.textContent = ex.message; er.hidden = false; }
    };
    f.addEventListener('submit', salvar);
    $('[data-salvar]', m).addEventListener('click', salvar);
  });
}

function mascaraTel(v) {
  const d = v.replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d;
  if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
}

function ligarFormServico(raiz, s = {}, clienteInicial = null) {
  let cliente = null;
  const sel = seletorCliente($('[data-cliente]', raiz), { inicialId: s.cliente_id || clienteInicial, aoEscolher: (c) => (cliente = c) });
  const valor = $('[name=valor]', raiz);
  mascaraDinheiro(valor, s.valor_centavos || 0);
  const data = $('[name=data_servico]', raiz);
  const venc = () => {
    const d = data.value;
    const sp = $('[data-venc] span', raiz);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { sp.textContent = 'Escolha a data do serviço.'; return; }
    const comp = d.slice(0, 7), j = janela(comp);
    sp.innerHTML = `Entra na cobrança de <b>${esc(nomeMes(comp))}</b>. O cliente paga entre <b>${dataBR(j.inicio)}</b> e <b>${dataBR(j.fim)}</b>.`;
  };
  data.addEventListener('input', venc); venc();
  return {
    dados() {
      const c = sel.get();
      if (!c) throw new Error('Escolha o cliente.');
      const v = centavosDe(valor);
      if (!v) throw new Error('Informe o valor do serviço.');
      return {
        cliente_id: c.id, data_servico: data.value, veiculo: $('[name=veiculo]', raiz).value,
        descricao: $('[name=descricao]', raiz).value, valor_centavos: v,
      };
    },
    erro(msg) { const e = $('.erro', raiz); e.textContent = msg; e.hidden = !msg; },
  };
}

  });

  const ctl = ligarFormServico(f, s);

    try { await api(`/servicos/${s.id}`, { method: 'PUT', body: ctl.dados() }); fecharModal(); toast('Serviço atualizado.'); aoSalvar && aoSalvar(); }

    catch (ex) { toast(ex.message, true); }
  };
}

  $('#f-comp').addEventListener('change', (e) => ir(e.target.value, status));
  $('#b-todos').onclick = () => ir(comp ? '' : padrao, status);
  $$('[data-st]').forEach((b) => b.onclick = () => ir(comp, b.dataset.st));
  $$('[data-ir]').forEach((tr) => tr.addEventListener('click', (e) => { if (!e.target.closest('button')) location.hash = tr.dataset.ir; }));
  $$('[data-rec]').forEach((b) => b.onclick = () => modalPagamento(faturas[Number(b.dataset.rec)], render));
  $('#b-csv').onclick = () => {
    const linhas = [['Cliente', 'Telefone', 'Mês dos serviços', 'Vence de', 'Vence até', 'Qtd serviços', 'Total', 'Pago', 'Falta', 'Situação']];
    faturas.forEach((f) => linhas.push([f.cliente_nome, f.cliente_telefone || '', nomeMesCurto(f.competencia), dataBR(f.inicio), dataBR(f.fim), f.qtd,
      (f.total / 100).toFixed(2).replace('.', ','), (f.pago / 100).toFixed(2).replace('.', ','), (Math.max(f.saldo, 0) / 100).toFixed(2).replace('.', ','), STATUS[f.status]]));
    const csv = '﻿' + linhas.map((l) => l.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `cobrancas-${comp || 'todas'}.csv`; a.click();
  };
}

function modalPagamento(f, aoSalvar) {
  const formas = ['Pix', 'Dinheiro', 'Cartão de débito', 'Cartão de crédito', 'Boleto', 'Transferência', 'Outro'];
  const m = abrirModal({
    titulo: 'Registrar pagamento',
    corpo: `<form id="f-pag"><div class="erro" hidden></div>
      <p style="margin:0 0 14px">${esc(f.cliente_nome)}, serviços de <b>${esc(nomeMes(f.competencia))}</b>.<br><span class="muted">Falta receber ${brl(f.saldo)}</span></p>
      <div class="campo"><label>Valor recebido</label><input class="input grande num" name="valor"></div>
      <div class="linha">
        <div class="campo"><label>Data</label><input class="input" type="date" name="data" value="${hojeISO()}"></div>
        <div class="campo"><label>Forma</label><select class="input" name="forma">${formas.map((x) => `<option>${x}</option>`).join('')}</select></div>
      </div>
      <div class="campo"><label>Observação (opcional)</label><input class="input" name="obs"></div>
      <button hidden></button></form>`,
    rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn pri" data-salvar>${I.dinheiro} Confirmar recebimento</button>`,
  });
  const fm = $('#f-pag', m);
  const valor = $('[name=valor]', fm);
  mascaraDinheiro(valor, Math.max(f.saldo, 0));
  setTimeout(() => valor.select(), 40);
  const salvar = async (e) => {
    e && e.preventDefault();
    const er = $('.erro', fm);
    try {
      await api('/pagamentos', { method: 'POST', body: {
        cliente_id: f.cliente_id, competencia: f.competencia, valor_centavos: centavosDe(valor),
        data_pagamento: $('[name=data]', fm).value, forma: $('[name=forma]', fm).value, observacao: $('[name=obs]', fm).value,
      } });
      fecharModal(); toast('Pagamento registrado.'); aoSalvar && aoSalvar();
    } catch (ex) { er.textContent = ex.message; er.hidden = false; }
  };
  fm.addEventListener('submit', salvar);
  $('[data-salvar]', m).onclick = salvar;
}

async function vClientes(view, params) {

        <tbody>${faturas.map((f) => `<tr class="clicavel" data-ir="#/fatura/${cliente.id}/${f.competencia}">
          <td><b>${esc(nomeMesCurto(f.competencia))}</b> <span class="muted small">${plural(f.qtd, 'serviço', 'serviços')}</span></td>
          <td class="esconde-mobile">${diaMes(f.inicio)} a ${diaMes(f.fim)}</td>
          <td class="dir num">${brl(f.total)}</td><td class="dir num esconde-mobile">${brl(f.pago)}</td>

  };
}

/* ================================== a cobrar ================================== */
async function vCobrar(view, params) {
  const { clientes, resumo } = await api('/carteira');
  atualizarBadge(resumo.clientes_vencidos);
  const filtro = params.get('f') || 'agora';
  const promAtiva = (c) => c.promessa && ['hoje', 'vencida', 'futura'].includes(c.promessa.situacao);
  const filtros = {
    agora: (c) => c.vencido + c.no_prazo > 0 || (c.promessa && ['hoje', 'vencida'].includes(c.promessa.situacao)),
    vencidos: (c) => c.vencido > 0,
    promessas: promAtiva,
    todos: () => true,
  };
  const chips = [['agora', 'Cobrar agora'], ['vencidos', 'Vencidos'], ['promessas', 'Com promessa'], ['todos', 'Todos que devem']];
  const prom = resumo.promessas_hoje + resumo.promessas_vencidas;

  view.innerHTML = topo('A cobrar', 'Quem está devendo, somando todos os meses. Os mais atrasados aparecem primeiro.') + `
  <div class="grid g-4">
    <div class="card kpi destaque"><div class="rot">Total a receber</div><div class="val num">${brl(resumo.total)}</div><div class="det">${plural(resumo.clientes, 'cliente devendo', 'clientes devendo')}</div></div>
    <div class="card kpi ${resumo.vencido ? 'alerta' : ''}"><div class="rot">Vencido</div><div class="val num">${brl(resumo.vencido)}</div><div class="det">${plural(resumo.clientes_vencidos, 'cliente atrasado', 'clientes atrasados')}</div></div>
    <div class="card kpi"><div class="rot">Vence agora</div><div class="val num">${brl(resumo.no_prazo)}</div><div class="det">Dentro do prazo de pagamento</div></div>
    <div class="card kpi"><div class="rot">Promessas para cobrar</div><div class="val num">${prom}</div><div class="det">${resumo.promessas_hoje} para hoje · ${resumo.promessas_vencidas} não cumpridas</div></div>
  </div>
  <div class="sep"></div>
  <div class="card">
    <div class="filtros">
      <div class="busca">${I.busca}<input class="input" id="f-q" placeholder="Buscar cliente"></div>
      <div class="chips" style="margin-left:auto">${chips.map(([v, l]) => `<button class="chip ${filtro === v ? 'ativo' : ''}" data-f="${v}">${l}</button>`).join('')}</div>
    </div>
    <div id="lista-dev"></div>
  </div>
  ${resumo.vencido + resumo.no_prazo < resumo.total ? `<p class="muted small" style="margin:12px 2px 0">Ainda vai vencer: ${brl(resumo.total - resumo.vencido - resumo.no_prazo)} (meses que ainda não chegaram no prazo de pagamento).</p>` : ''}`;

  const desenhar = () => {
    const q = normal($('#f-q').value.trim());
    const lista = clientes.filter(filtros[filtro] || filtros.agora).filter((c) => !q || normal(c.cliente_nome).includes(q) || normal(c.cliente_telefone).includes(q));
    $('#lista-dev').innerHTML = lista.length ? lista.map((c) => {
      const tel = linkTel(c.cliente_telefone);
      const situacao = c.vencido ? `<span class="tag st-vencida">${c.atraso_dias ? plural(c.atraso_dias, 'dia de atraso', 'dias de atraso') : 'Vencida'}</span>`
        : c.no_prazo ? '<span class="tag st-no_prazo">Vence agora</span>' : '<span class="tag st-a_vencer">Ainda não venceu</span>';
      const a = c.ultima;
      return `<div class="dev ${c.vencido ? 'atrasado' : ''}">
        <div class="dev-topo">
          <div style="min-width:0"><a class="dev-nome" href="#/clientes/${c.cliente_id}">${esc(c.cliente_nome)}</a>
            <div class="dev-sub">${tel ? `<a href="${tel}">${I.tel.replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"')} ${esc(c.cliente_telefone)}</a>` : '<span>Sem telefone</span>'}<span>·</span><span>${plural(c.meses.length, 'mês em aberto', 'meses em aberto')}</span></div></div>

        </div>
        <div class="meses">${c.meses.map((m) => `<a class="mes ${m.status}" href="#/fatura/${c.cliente_id}/${m.competencia}" title="${esc(STATUS[m.status])}">${esc(nomeMesCurto(m.competencia))} <b class="num">${brl(m.saldo)}</b></a>`).join('')}</div>
        ${a ? `<div class="nota"><div style="min-width:0"><div class="quem">${esc(quando(a.criado_em))}${a.autor ? ` · ${esc(a.autor)}` : ''}</div>${a.texto ? `<div class="txt">${esc(a.texto)}</div>` : ''}</div><div>${tagPromessa(c.promessa && c.promessa.id === a.id ? c.promessa : null)}</div></div>` : ''}
        ${c.promessa && (!a || c.promessa.id !== a.id) && c.promessa.situacao !== 'cumprida' ? `<div>${tagPromessa(c.promessa)}</div>` : ''}
        <div class="dev-acoes">
          <button class="btn pri sm" data-rec="${c.cliente_id}">${I.dinheiro} Receber</button>
          <button class="btn sm" data-nota="${c.cliente_id}">${I.nota} Anotar cobrança</button>
          ${tel ? `<a class="btn sm" href="${tel}">${I.tel} Ligar</a>` : ''}
        </div>
      </div>`;
    }).join('') : `<div class="vazio"><b>${clientes.length ? 'Ninguém nesse filtro' : 'Ninguém devendo'}</b>${clientes.length ? 'Troque o filtro para ver os outros clientes.' : 'Todas as contas estão pagas.'}</div>`;
    const achar = (id) => clientes.find((c) => c.cliente_id === Number(id));
    $$('[data-rec]').forEach((b) => b.onclick = () => modalReceberDivida(achar(b.dataset.rec), render));

  };

  $$('[data-f]').forEach((b) => b.onclick = () => (location.hash = '#/cobrar?f=' + b.dataset.f));
  desenhar();
}

/* recebe um valor e abate dos meses mais antigos primeiro */
function modalReceberDivida(c, aoSalvar) {
  const meses = (c.meses || []).filter((m) => m.saldo > 0).sort((a, b) => a.competencia.localeCompare(b.competencia));
  const divida = meses.reduce((a, m) => a + m.saldo, 0);
  const formas = ['Dinheiro', 'Pix', 'Cartão de débito', 'Cartão de crédito', 'Transferência', 'Boleto', 'Outro'];
  const m = abrirModal({
    titulo: 'Receber do cliente', largura: 520,
    corpo: `<form id="f-recd"><div class="erro" hidden></div>
      <p style="margin:0 0 12px"><b>${esc(c.cliente_nome)}</b> deve <b class="num">${brl(divida)}</b>${meses.length > 1 ? ` em ${meses.length} meses` : ''}.<br>
      <span class="muted small">Pode receber só uma parte. O valor abate primeiro os meses mais antigos e o resto fica para depois.</span></p>
      <div class="campo"><label>Quanto o cliente pagou agora</label><input class="input grande num" name="valor"></div>
      <ul class="divisao" data-div></ul>
      <div class="linha">
        <div class="campo"><label>Data</label><input class="input" type="date" name="data" value="${hojeISO()}"></div>
        <div class="campo"><label>Forma</label><select class="input" name="forma">${formas.map((x) => `<option>${x}</option>`).join('')}</select></div>
      </div>
      <div class="campo"><label>Observação (opcional)</label><input class="input" name="obs" placeholder="Ex: pagou no balcão"></div>
      <button hidden></button></form>`,
    rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn pri" data-salvar>${I.dinheiro} Confirmar recebimento</button>`,
  });
  const fm = $('#f-recd', m);
  const valor = $('[name=valor]', fm);
  mascaraDinheiro(valor, divida);
  setTimeout(() => valor.select(), 40);
  const previa = () => {
    let resta = centavosDe(valor);
    const linhas = meses.map((x) => {
      const parte = Math.min(resta, x.saldo); resta -= parte;
      const cls = parte === x.saldo ? 'quita' : parte > 0 ? 'parcial' : '';
      const txt = parte === x.saldo ? 'quita' : parte > 0 ? `abate ${brl(parte)}, fica ${brl(x.saldo - parte)}` : `fica ${brl(x.saldo)}`;
      return `<li class="${cls}"><span>${esc(nomeMesCurto(x.competencia))} <span class="muted">(${brl(x.saldo)})</span></span><b class="num">${txt}</b></li>`;
    });
    const v = centavosDe(valor);
    const falta = Math.max(divida - v, 0);
    linhas.push(v > divida
      ? `<li style="color:var(--red)"><span>Valor maior que a dívida</span><b class="num">${brl(divida)}</b></li>`
      : `<li><span><b>Depois disso fica faltando</b></span><b class="num">${brl(falta)}</b></li>`);
    $('[data-div]', fm).innerHTML = linhas.join('');
  };
  valor.addEventListener('input', previa); previa();
  const salvar = async (e) => {
    e && e.preventDefault();
    const er = $('.erro', fm); er.hidden = true;
    const btn = $('[data-salvar]', m); btn.disabled = true;
    try {
      const r = await api(`/clientes/${c.cliente_id}/receber`, { method: 'POST', body: {
        valor_centavos: centavosDe(valor), data_pagamento: $('[name=data]', fm).value, forma: $('[name=forma]', fm).value, observacao: $('[name=obs]', fm).value,
      } });
      fecharModal();
      toast(r.restante ? `Recebido ${brl(centavosDe(valor))}. Ainda falta ${brl(r.restante)}.` : `Recebido ${brl(centavosDe(valor))}. Conta quitada.`);
      atualizarBadge(); aoSalvar && aoSalvar();
    } catch (ex) { er.textContent = ex.message; er.hidden = false; btn.disabled = false; }
  };
  fm.addEventListener('submit', salvar);
  $('[data-salvar]', m).onclick = salvar;
}

/* ================================== gráficos ================================== */
/* Desenhados em SVG, sem biblioteca. Cores validadas para daltonismo:
   azul e amarelo (serviços x recebido), azul/amarelo/vermelho (pontualidade)
   e uma escala de vermelhos para a idade da dívida. */
const COR = { azul: '#2a78d6', amarelo: '#eda100', vermelho: '#e34948' };
const COR_IDADE = ['#f19d9b', '#e3605c', '#c0322f', '#86191a'];
const SVGNS = 'http://www.w3.org/2000/svg';
const MES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const rotuloMes = (comp, comAno) => { const [a, m] = comp.split('-'); return MES_CURTO[Number(m) - 1] + (comAno ? `/${a.slice(2)}` : ''); };
/* eixo: R$ 0 / R$ 500 / R$ 1 mil / R$ 2,5 mil / R$ 1,2 mi */
function brlCurto(c) {
  const v = c / 100;
  const f = (x) => x.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  if (v >= 1e6) return `R$ ${f(v / 1e6)} mi`;
  if (v >= 1000) return `R$ ${f(v / 1000)} mil`;
  return `R$ ${Math.round(v)}`;
}
function escalaBonita(max) {
  if (max <= 0) return { topo: 100000, passos: [0, 25000, 50000, 75000, 100000] };
  const bruto = max / 4;
  const p10 = 10 ** Math.floor(Math.log10(bruto));
  const passo = [1, 2, 2.5, 5, 10].map((k) => k * p10).find((x) => x >= bruto);
  const topo = Math.ceil(max / passo) * passo;
  const passos = [];
  for (let v = 0; v <= topo + 1e-6; v += passo) passos.push(v);
  return { topo, passos };
}
const svgEl = (tag, at = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
/* coluna com 4px arredondado só na ponta, reta na base */
function caminhoColuna(x, y, w, h, arred) {
  if (h <= 0) return '';
  const r = arred ? Math.min(4, w / 2, h) : 0;
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function mostrarDica(html, x, y) {
  const d = $('#dica-graf');
  d.innerHTML = html; d.hidden = false;
  const r = d.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (left < 8) left = 8;
  if (top < 8) top = y + 16;
  d.style.left = left + 'px'; d.style.top = top + 'px';
}
function esconderDica() { const d = $('#dica-graf'); if (d) d.hidden = true; }
document.addEventListener('scroll', esconderDica, { passive: true });
document.addEventListener('pointerdown', (e) => { if (!e.target.closest || !e.target.closest('.faixa')) esconderDica(); });
let tRedim;
window.addEventListener('resize', () => { clearTimeout(tRedim); tRedim = setTimeout(() => (S.graficos || []).forEach((f) => f()), 150); });

const legendaHTML = (series) => `<div class="legenda">${series.map((s) => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
const linhaDica = (cor, nome, valor) => `<div class="lin"><span><i style="background:${cor}"></i>${esc(nome)}</span><b style="display:inline;margin:0">${valor}</b></div>`;

/* colunas agrupadas ou empilhadas, uma faixa por mês */
function graficoColunas(el, { categorias, series, empilhado = false, altura = 230, rodapeDica }) {
  const desenhar = () => {
    const W = Math.max(el.clientWidth, 260);
    const n = categorias.length;
    const mE = 62, mD = 6, mT = 10, mB = 26;
    const pw = W - mE - mD, ph = altura - mT - mB;
    const totais = categorias.map((_, i) => empilhado ? series.reduce((a, s) => a + s.valores[i], 0) : Math.max(...series.map((s) => s.valores[i])));
    const { topo, passos } = escalaBonita(Math.max(...totais));
    const yv = (v) => mT + ph - (v / topo) * ph;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${altura}`, role: 'img' });
    passos.forEach((v) => {
      svg.appendChild(svgEl('line', { class: 'grade', x1: mE, x2: W - mD, y1: yv(v), y2: yv(v) }));
      const t = svgEl('text', { class: 'eixo-txt', x: mE - 8, y: yv(v) + 4, 'text-anchor': 'end' }); t.textContent = brlCurto(v); svg.appendChild(t);
    });
    const banda = pw / n;
    const pulo = banda < 30 ? 2 : 1;
    categorias.forEach((cat, i) => {
      const x0 = mE + i * banda;
      const g = svgEl('g');
      const faixa = svgEl('rect', { class: 'faixa', x: x0, y: mT, width: banda, height: ph, tabindex: 0, 'aria-label': `${cat.titulo}: ${series.map((s) => `${s.nome} ${brl(s.valores[i])}`).join(', ')}` });
      g.appendChild(faixa);
      if (empilhado) {
        const w = Math.min(24, banda * 0.62);
        const x = x0 + (banda - w) / 2;
        let base = mT + ph;
        const vis = series.map((s, k) => ({ s, v: s.valores[i], k })).filter((o) => o.v > 0);
        vis.forEach((o, j) => {
          const h = (o.v / topo) * ph - (j > 0 ? 2 : 0);
          if (h <= 0) return;
          const y = base - (j > 0 ? 2 : 0) - h;
          g.appendChild(svgEl('path', { d: caminhoColuna(x, y, w, h, j === vis.length - 1), fill: o.s.cor, 'pointer-events': 'none' }));
          base = y;
        });
      } else {
        const k = series.length;
        const w = Math.min(24, (banda * 0.72 - 2 * (k - 1)) / k);
        const tot = w * k + 2 * (k - 1);
        series.forEach((s, j) => {
          const v = s.valores[i];
          const h = (v / topo) * ph;
          const x = x0 + (banda - tot) / 2 + j * (w + 2);
          if (h > 0) g.appendChild(svgEl('path', { d: caminhoColuna(x, mT + ph - h, w, Math.max(h, 1), true), fill: s.cor, 'pointer-events': 'none' }));
        });
      }
      if ((n - 1 - i) % pulo === 0) {
        const t = svgEl('text', { class: 'eixo-txt', x: x0 + banda / 2, y: altura - 8, 'text-anchor': 'middle' });
        t.textContent = cat.rotulo; g.appendChild(t);
      }
      const dica = () => `<b>${esc(cat.titulo)}</b>` + series.map((s) => linhaDica(s.cor, s.nome, brl(s.valores[i]))).join('') + (rodapeDica ? rodapeDica(i) : '');
      const abrir = (e) => { const r = faixa.getBoundingClientRect(); mostrarDica(dica(), e && e.clientX ? e.clientX : r.left + r.width / 2, e && e.clientY ? e.clientY : r.top + 30); };
      faixa.addEventListener('pointermove', abrir);
      faixa.addEventListener('pointerdown', abrir);
      faixa.addEventListener('focus', () => abrir());
      faixa.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') esconderDica(); });
      faixa.addEventListener('blur', esconderDica);
      svg.appendChild(g);
    });
    svg.appendChild(svgEl('line', { class: 'grade', x1: mE, x2: W - mD, y1: mT + ph, y2: mT + ph, stroke: '#d4d4cd' }));
    el.innerHTML = ''; el.appendChild(svg);
  };
  desenhar();
  (S.graficos ||= []).push(desenhar);
}

/* tabela com os mesmos números do gráfico (para ler sem passar o dedo) */
function tabelaGrafico(cab, linhas) {
  return `<div class="tab-graf" hidden><table><thead><tr>${cab.map((c, i) => `<th class="${i ? 'dir' : ''}">${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${linhas.map((l) => `<tr>${l.map((c, i) => `<td class="${i ? 'dir num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function ligarTabelas(raiz) {
  $$('[data-tab]', raiz).forEach((b) => b.onclick = () => {
    const t = $('.tab-graf', b.closest('.card'));
    t.hidden = !t.hidden; b.textContent = t.hidden ? 'Ver em tabela' : 'Esconder tabela';
  });
}

/* 1. serviços feitos x dinheiro recebido */
function cardMovimento(mov, { compacto = false } = {}) {
  const series = [
    { nome: 'Serviços feitos', cor: COR.amarelo, valores: mov.map((m) => m.servicos) },
    { nome: 'Dinheiro recebido', cor: COR.azul, valores: mov.map((m) => m.recebido) },
  ];
  const vazio = !mov.some((m) => m.servicos || m.recebido);
  const html = `<div class="card">
    <div class="card-h"><div><h3>Serviços feitos x dinheiro recebido</h3><div class="muted small">Por mês. O recebido conta o dia em que o dinheiro entrou.</div></div>
      ${compacto ? '<a class="btn sm" href="#/relatorios">Relatórios</a>' : '<button class="btn-tab" data-tab>Ver em tabela</button>'}</div>
    <div class="card-b">${vazio ? '<div class="vazio" style="padding:20px"><b>Ainda sem movimento</b>O gráfico aparece conforme vocês lançam serviços e recebem pagamentos.</div>'
      : `${legendaHTML(series)}<div class="graf" data-graf="mov"></div>
      ${tabelaGrafico(['Mês', 'Serviços feitos', 'Dinheiro recebido'], mov.map((m) => [esc(nomeMesCurto(m.competencia)), brl(m.servicos), brl(m.recebido)]))}`}</div></div>`;
  const ligar = (raiz) => {
    const el = $('[data-graf=mov]', raiz); if (!el) return;
    graficoColunas(el, { series, altura: compacto ? 190 : 240,
      categorias: mov.map((m, i) => ({ rotulo: rotuloMes(m.competencia, i === 0 || m.competencia.endsWith('-01')), titulo: nomeMesCurto(m.competencia) })),
      rodapeDica: (i) => { const d = mov[i].recebido - mov[i].servicos; return `<div class="lin" style="margin-top:5px;border-top:1px solid #333;padding-top:5px"><span>Diferença</span><b style="display:inline;margin:0">${d >= 0 ? '+' : '-'}${brl(Math.abs(d))}</b></div>`; } });
  };
  return { html, ligar };
}

      ${tabelaGrafico(['Mês dos serviços', 'Pago no prazo', 'Pago com atraso', 'Ainda em aberto'], d.pontualidade.map((p) => [esc(nomeMesCurto(p.competencia)), brl(p.no_prazo), brl(p.atrasado), brl(p.em_aberto)]))}`
      : '<div class="vazio" style="padding:20px"><b>Ainda sem meses fechados</b>O gráfico aparece quando houver serviços de meses anteriores.</div>'}</div>
  </div>`;

  mov.ligar(view);
  const ep = $('[data-graf=pont]', view);
  if (ep) graficoColunas(ep, { series: pontSeries, empilhado: true,
    categorias: d.pontualidade.map((p, i) => ({ rotulo: rotuloMes(p.competencia, i === 0 || p.competencia.endsWith('-01')), titulo: `Serviços de ${nomeMesCurto(p.competencia)}` })),
    rodapeDica: (i) => { const p = d.pontualidade[i]; return p.total ? `<div class="lin" style="margin-top:5px;border-top:1px solid #333;padding-top:5px"><span>No prazo</span><b style="display:inline;margin:0">${pct(p.no_prazo, p.total)}%</b></div>` : ''; } });
  ligarTabelas(view);
  $$('[data-m]', view).forEach((b) => b.onclick = () => (location.hash = '#/relatorios?meses=' + b.dataset.m));
}

/* ================================ instalar o app ================================ */
let pedidoInstalar = null;
const estaInstalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ehIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); pedidoInstalar = e; if (rotaAtual().partes[0] === 'painel' || rotaAtual().partes[0] === 'config') render(); });
window.addEventListener('appinstalled', () => { pedidoInstalar = null; toast('App instalado. Agora é só abrir pela tela inicial.'); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

async function instalarApp() {
  if (pedidoInstalar) {
    pedidoInstalar.prompt();
    await pedidoInstalar.userChoice.catch(() => {});
    pedidoInstalar = null;
    return;
  }
  abrirModal({ titulo: 'Instalar o app', corpo: ehIOS()
    ? `<ol style="margin:0;padding-left:20px;line-height:1.8"><li>Abra este endereço no <b>Safari</b>.</li><li>Toque no botão <b>Compartilhar</b> (o quadrado com a seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b> e toque em <b>Adicionar</b>.</li></ol>`
    : `<ol style="margin:0;padding-left:20px;line-height:1.8"><li>Abra este endereço no <b>Chrome</b>.</li><li>Toque nos <b>três pontinhos</b> no canto de cima.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li></ol>`,
    rodape: '<button class="btn pri" data-fechar>Entendi</button>' });
}
/* faixa no painel, só no celular/tablet, até instalar ou dispensar */
function faixaInstalar() {
  if (estaInstalado() || localStorage.getItem('instalar_dispensado') === '1') return '';
  if (!pedidoInstalar && !(ehIOS() || matchMedia('(max-width:1100px)').matches)) return '';
  return `<div class="instalar"><img src="/icone-192.png" alt=""><div><b>Instale a carteira no celular ou tablet</b>Abre direto da tela inicial, como um aplicativo.</div>
    <button class="btn pri sm" data-instalar>Instalar</button><button class="icon-btn" data-dispensar aria-label="Dispensar">${I.x}</button></div>`;
}
function ligarFaixaInstalar(raiz) {
  const b = $('[data-instalar]', raiz); if (b) b.onclick = instalarApp;
  const x = $('[data-dispensar]', raiz); if (x) x.onclick = () => { localStorage.setItem('instalar_dispensado', '1'); x.closest('.instalar').remove(); };
}

/* ================================== ajustes ================================== */
async function vConfig(view) {
  const cfg = await api('/config');
  S.config = cfg;
  const admin = S.usuario.admin;
  view.innerHTML = topo('Ajustes', admin ? 'Dados da oficina, equipe e senha' : 'Sua senha de acesso') + `
  <div class="grid g-2" style="align-items:start">
    <form class="card" id="f-cfg">
      <div class="card-h"><h3>Oficina e vencimento</h3></div>
      <div class="card-b"><div class="erro" hidden></div>
        <div class="campo"><label>Nome da oficina</label><input class="input" name="nome_oficina" value="${esc(cfg.nome_oficina)}" ${admin ? '' : 'disabled'}></div>
        <div class="campo"><label>Chave Pix (aparece na fatura impressa)</label><input class="input" name="chave_pix" value="${esc(cfg.chave_pix)}" placeholder="CNPJ, celular, e-mail ou chave aleatória" ${admin ? '' : 'disabled'}></div>
        <div class="linha">
          <div class="campo"><label>Pagamento a partir do dia</label><input class="input" type="number" min="1" max="31" name="dia_inicio" value="${cfg.dia_inicio}" ${admin ? '' : 'disabled'}></div>
          <div class="campo"><label>Até o dia</label><input class="input" type="number" min="1" max="31" name="dia_fim" value="${cfg.dia_fim}" ${admin ? '' : 'disabled'}></div>
        </div>
        <div class="dica">${I.info}<span>Os serviços de um mês são cobrados entre esses dias do mês seguinte. Ex: serviços de novembro vencem de ${pad(cfg.dia_inicio)}/12 a ${pad(cfg.dia_fim)}/12.</span></div>
        ${admin ? '<div class="sep"></div><button class="btn pri" type="submit">Salvar ajustes</button>' : ''}
      </div>
    </form>
    <form class="card" id="f-senha">
      <div class="card-h"><h3>Minha senha</h3></div>
      <div class="card-b"><div class="erro" hidden></div>
        <div class="campo"><label>Senha atual</label><input class="input" type="password" name="senha_atual" autocomplete="current-password" required></div>
        <div class="campo"><label>Nova senha (mínimo 8 caracteres)</label><input class="input" type="password" name="senha_nova" minlength="8" autocomplete="new-password" required></div>
        <button class="btn esc" type="submit">Trocar senha</button>
      </div>
    </form>
  </div>
  ${admin ? `<div class="sep"></div><div class="card"><div class="card-h"><h3>Equipe com acesso</h3><button class="btn sm" id="b-novo-u">${I.mais} Adicionar pessoa</button></div><div id="usuarios"></div></div>` : ''}
  <div class="sep"></div>
  <div class="card"><div class="card-h"><div><h3>App no celular e no tablet</h3><div class="muted small">${estaInstalado() ? 'Você já está usando o app instalado.' : 'Instale para abrir direto da tela inicial, sem precisar do navegador.'}</div></div>
    ${estaInstalado() ? '<span class="tag st-paga">Instalado</span>' : `<button class="btn pri sm" id="b-instalar">Instalar app</button>`}</div></div>
  <div class="sep"></div>
  <button class="btn" id="b-sair2" style="display:none">Sair da conta</button>`;
  const bi = $('#b-instalar'); if (bi) bi.onclick = instalarApp;

  if (admin) {
    $('#f-cfg').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      body.dia_inicio = Number(body.dia_inicio); body.dia_fim = Number(body.dia_fim);
      const er = $('.erro', e.target); er.hidden = true;
      try { S.config = await api('/config', { method: 'PUT', body }); aplicarNomeOficina(); toast('Ajustes salvos.'); }
      catch (ex) { er.textContent = ex.message; er.hidden = false; }
    });
    const desenharUsuarios = (usuarios) => {
      $('#usuarios').innerHTML = `<div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Acesso</th><th></th></tr></thead><tbody>
        ${usuarios.map((u) => `<tr><td><b>${esc(u.nome)}</b>${u.id === S.usuario.id ? ' <span class="muted small">(você)</span>' : ''}</td><td>${esc(u.usuario)}</td>
        <td>${u.ativo ? (u.admin ? '<span class="tag st-a_vencer">Administrador</span>' : '<span class="tag st-paga">Equipe</span>') : '<span class="tag st-vencida">Bloqueado</span>'}</td>
        <td class="acoes-td"><button class="icon-btn" data-u="${u.id}" title="Editar">${I.editar}</button></td></tr>`).join('')}</tbody></table></div>`;
      $$('[data-u]').forEach((b) => b.onclick = () => modalUsuario(usuarios.find((u) => u.id === Number(b.dataset.u)), desenharUsuarios));
    };
    desenharUsuarios((await api('/usuarios')).usuarios);
    $('#b-novo-u').onclick = () => modalUsuario(null, desenharUsuarios);
  }
  $('#f-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    const er = $('.erro', e.target); er.hidden = true;
    try { await api('/me/senha', { method: 'PUT', body }); e.target.reset(); toast('Senha alterada.'); }
    catch (ex) { er.textContent = ex.message; er.hidden = false; }
  });
  if (window.matchMedia('(max-width:820px)').matches) {
    const b = $('#b-sair2'); b.style.display = ''; b.onclick = () => $('#btn-sair').click();
  }
}

function modalUsuario(u, aoSalvar) {
  const novo = !u;
  const m = abrirModal({
    titulo: novo ? 'Adicionar pessoa' : 'Editar acesso',
    corpo: `<form id="f-u"><div class="erro" hidden></div>
      <div class="campo"><label>Nome</label><input class="input" name="nome" required value="${esc(u?.nome)}"></div>
      <div class="campo"><label>Usuário para entrar</label><input class="input" name="usuario" autocapitalize="none" ${novo ? 'required' : 'disabled'} value="${esc(u?.usuario)}"></div>
      <div class="campo"><label>${novo ? 'Senha (mínimo 8 caracteres)' : 'Nova senha (deixe em branco para manter)'}</label><input class="input" type="password" name="senha" autocomplete="new-password" ${novo ? 'required minlength="8"' : ''}></div>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="checkbox" name="admin" ${u?.admin ? 'checked' : ''}> Administrador (pode mexer nos ajustes e na equipe)</label>
      ${novo ? '' : `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="ativo" ${u.ativo ? 'checked' : ''}> Acesso liberado</label>`}
      <button hidden></button></form>`,
    rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn pri" data-salvar>${novo ? 'Adicionar' : 'Salvar'}</button>`,
  });
  const f = $('#f-u', m);
  const salvar = async (e) => {
    e && e.preventDefault();
    const body = { nome: f.nome.value, admin: f.admin.checked };
    if (f.senha.value) body.senha = f.senha.value;
    if (novo) body.usuario = f.usuario.value; else body.ativo = f.ativo.checked;
    try {
      const r = novo ? await api('/usuarios', { method: 'POST', body }) : await api(`/usuarios/${u.id}`, { method: 'PUT', body });
      fecharModal(); toast(novo ? 'Pessoa adicionada.' : 'Acesso atualizado.'); aoSalvar(r.usuarios);
    } catch (ex) { const er = $('.erro', f); er.textContent = ex.message; er.hidden = false; }
  };
  f.addEventListener('submit', salvar);
  $('[data-salvar]', m).onclick = salvar;
}

boot();
</script>
</body>
</html>
